name: ci

on:
  push:
  pull_request:

jobs:
  # Nivel A: Swift puro en Linux (sin SDK de Apple). `tools/test-all.sh` omite el paquete AppleKit en Linux.
  linux-tests:
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: apt-get update -qq && apt-get install -y -qq python3 git >/dev/null
      - name: swift test (paquetes de Swift puro) y claves de texto
        run: bash tools/test-all.sh

  # Nivel B: macOS. Sin verificar: la versión de Xcode del runner `macos-latest`, los nombres de los esquemas que genera
  # SwiftPM y el simulador elegido. Cada paso imprime lo que usa para poder corregirlo con la salida real.
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        run: |
          swift --version
          xcodebuild -version
      - name: Paquetes de Swift puro en macOS
        run: |
          for package in Packages/Core Packages/DesignSystem; do
            echo "=== $package"
            (cd "$package" && swift test) || exit 1
          done
      - name: Elige un simulador de iPhone
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = [d for runtime in json.load(sys.stdin)['devices'].values() for d in runtime]
          names = sorted({d['name'] for d in devices if d['name'].startswith('iPhone')})
          print(names[-1])")
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Simulador: $NAME"
      - name: Esquemas de AppleKit y de la app
        run: |
          (cd Packages/AppleKit && xcodebuild -list)
          xcodebuild -list
      - name: Pruebas de AppleKit en el simulador de iOS
        working-directory: Packages/AppleKit
        run: |
          set -o pipefail
          xcodebuild test -scheme AppleKit-Package \
            -destination "platform=iOS Simulator,name=$SIM_NAME" | tee ../../xcodebuild-test.log
      - name: Compila la app para el simulador de iOS
        run: |
          set -o pipefail
          xcodebuild build -scheme VenueNexaApp \
            -destination "platform=iOS Simulator,name=$SIM_NAME" | tee xcodebuild-app.log
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos
          path: "*.log"
